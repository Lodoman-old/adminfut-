{% extends "base.html" %}
{% block title %}Cambiar servidor - AdminFut{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="bi bi-server"></i> Cambiar servidor</h5>
      </div>
      <div class="card-body">
        <p class="text-muted">Ingresa la nueva URL del servidor. La app se reconectará automáticamente.</p>
        <input id="newUrl" type="url" class="form-control mb-3" placeholder="https://adminfut.onrender.com" value="https://adminfut.onrender.com">
        <button id="saveBtn" class="btn btn-success w-100" onclick="saveServer()"><i class="bi bi-check-lg"></i> Cambiar y reconectar</button>
        <div id="status" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>
<script>
async function saveServer() {
  var url = document.getElementById('newUrl').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('status').innerHTML = '<div class="spinner-border spinner-border-sm"></div> Guardando...';
  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
      await window.Capacitor.Plugins.Preferences.set({ key: 'serverUrl', value: url });
      document.getElementById('status').innerHTML = '<div class="alert alert-success">URL guardada. Reconectando...</div>';
      setTimeout(function() { window.location.href = url; }, 1000);
    } else {
      // Fallback: no Capacitor (navegador web normal)
      document.getElementById('status').innerHTML = '<div class="alert alert-info">No se detectó la app. En un navegador, la URL se guarda en localStorage.</div>';
      localStorage.setItem('serverUrl', url);
    }
  } catch (e) {
    document.getElementById('status').innerHTML = '<div class="alert alert-danger">Error: ' + e.message + '</div>';
    document.getElementById('saveBtn').disabled = false;
  }
}
</script>
{% endblock %}
