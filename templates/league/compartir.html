<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <meta name="description" content="{{ descripcion }}">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ nombre_liga }}">
    <meta property="og:title" content="{{ titulo }}">
    <meta property="og:description" content="{{ descripcion }}">
    <meta property="og:image" content="{{ imagen_url }}">
    <meta property="og:image:secure_url" content="{{ imagen_url }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="{{ imagen_ancho }}">
    <meta property="og:image:height" content="{{ imagen_alto }}">
    <meta property="og:image:alt" content="{{ titulo }}">
    <meta property="og:url" content="{{ url_publica }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ titulo }}">
    <meta name="twitter:description" content="{{ descripcion }}">
    <meta name="twitter:image" content="{{ imagen_url }}">

    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f6f3;
            color: #1c201c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; flex-wrap: wrap;
        }
        .btn-top {
            font-size: 12px; font-weight: 700; color: #225428;
            text-decoration: none; border: 1px solid #225428;
            border-radius: 8px; padding: 5px 10px; white-space: nowrap;
            background: #fff;
        }
        .btn-top:hover { background: #225428; color: #fff; }
        .brand {
            display: flex; align-items: center; gap: 10px;
            color: #225428; font-weight: 700; font-size: 15px;
            letter-spacing: .3px; text-transform: uppercase;
        }
        .brand span { width: 10px; height: 10px; border-radius: 50%; background: #d4af37; }
        .card {
            background: #fff; border: 1px solid #dee4de; border-radius: 16px;
            overflow: hidden; margin-top: 14px;
            box-shadow: 0 6px 18px rgba(34, 84, 40, .07);
        }
        .card img { display: block; width: 100%; height: auto; }
        .texto {
            padding: 18px 18px 6px; font-size: 16px; line-height: 1.55;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .acciones { padding: 0 18px 20px; }
        .btn-volver {
            display: block; text-align: center; text-decoration: none;
            padding: 12px 16px; border-radius: 10px; font-weight: 700;
            font-size: 15px; background: #225428; color: #fff;
        }
        .btn-volver:hover { background: #1a4320; color: #fff; }
        .pie { text-align: center; font-size: 12px; margin-top: 18px; }
        .pie a { color: #6e766e; text-decoration: none; }
        .pie a:hover { color: #225428; }
        .sponsor {
            margin-top: 16px; background: #fff; border: 1px solid #dee4de;
            border-radius: 14px; padding: 10px 12px 12px; text-align: center;
            box-shadow: 0 4px 14px rgba(34, 84, 40, .06);
        }
        .sponsor-label {
            font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
            color: #8a928a; font-weight: 700; margin-bottom: 7px;
        }
        .sponsor a { display: block; text-decoration: none; color: #1c201c; }
        .sponsor img {
            display: block; max-width: 100%; max-height: 96px; margin: 0 auto;
            object-fit: contain; border-radius: 8px;
        }
        .sponsor-box { border-radius: 10px; padding: 12px; color: #fff; }
        .sponsor-box strong { display: block; font-size: 15px; }
        .sponsor-box span { display: block; font-size: 12px; opacity: .85; margin-top: 3px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="brand"><span></span>{{ nombre_liga }}</div>
        <a class="btn-top" href="{{ volver_url }}">← Dashboard</a>
    </div>

    <div class="card">
        <img src="{{ imagen_grande_url }}" alt="{{ titulo }}">
        <div class="texto">{{ texto }}</div>
        <div class="acciones">
            <a class="btn-volver" href="{{ volver_url }}">Ir al dashboard</a>
        </div>
    </div>

    {% for a in anuncios %}
    <div class="sponsor" data-anuncio-id="{{ a.id }}">
        <div class="sponsor-label">Patrocinado por</div>
        <a href="{% url 'detalle_anuncio' a.id %}?origen=compartido">
            {% if a.imagen %}
            <img src="{{ a.imagen.url }}" alt="{{ a.titulo }}">
            {% else %}
            <div class="sponsor-box" style="{% if a.color_fondo %}background: {{ a.color_fondo }};{% else %}background: #225428;{% endif %}">
                <strong>{{ a.titulo }}</strong>
                {% if a.descripcion %}<span>{{ a.descripcion|truncatechars:90 }}</span>{% endif %}
            </div>
            {% endif %}
        </a>
    </div>
    {% endfor %}

    <p class="pie"><a href="{{ volver_url }}">juventinorosasliga.com</a></p>
</div>
{% if anuncios %}
<script>
(function () {
    var el = document.querySelector('.sponsor[data-anuncio-id]');
    if (!el) { return; }
    fetch('/publicidad/' + el.getAttribute('data-anuncio-id') + '/impresion/?origen=compartido',
          { credentials: 'same-origin' }).catch(function () {});
})();
</script>
{% endif %}
</body>
</html>
