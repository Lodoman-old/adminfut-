<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <meta name="description" content="{{ descripcion }}">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ nombre_liga }}">
    <meta property="og:title" content="{{ titulo }}">
    <meta property="og:description" content="{{ descripcion }}">
    <meta property="og:image" content="{{ imagen_url }}">
    <meta property="og:image:secure_url" content="{{ imagen_url }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="{{ imagen_ancho }}">
    <meta property="og:image:height" content="{{ imagen_alto }}">
    <meta property="og:image:alt" content="{{ titulo }}">
    <meta property="og:url" content="{{ url_publica }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ titulo }}">
    <meta name="twitter:description" content="{{ descripcion }}">
    <meta name="twitter:image" content="{{ imagen_url }}">

    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f6f3;
            color: #1c201c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
        .brand {
            display: flex; align-items: center; gap: 10px;
            color: #225428; font-weight: 700; font-size: 15px;
            letter-spacing: .3px; text-transform: uppercase;
        }
        .brand span { width: 10px; height: 10px; border-radius: 50%; background: #d4af37; }
        .card {
            background: #fff; border: 1px solid #dee4de; border-radius: 16px;
            overflow: hidden; margin-top: 14px;
            box-shadow: 0 6px 18px rgba(34, 84, 40, .07);
        }
        .card img { display: block; width: 100%; height: auto; }
        .texto {
            padding: 18px 18px 6px; font-size: 16px; line-height: 1.55;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .pie { text-align: center; font-size: 12px; margin-top: 18px; }
        .pie a { color: #6e766e; text-decoration: none; }
        .pie a:hover { color: #225428; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand"><span></span>{{ nombre_liga }}</div>

    <div class="card">
        <img src="{{ imagen_grande_url }}" alt="{{ titulo }}">
        <div class="texto">{{ texto }}</div>
    </div>

    <p class="pie"><a href="{{ volver_url }}">juventinorosasliga.com</a></p>
</div>
</body>
</html>
