<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <meta name="description" content="{{ descripcion }}">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ nombre_liga }}">
    <meta property="og:title" content="{{ titulo }}">
    <meta property="og:description" content="{{ descripcion }}">
    <meta property="og:image" content="{{ imagen_url }}">
    <meta property="og:image:alt" content="{{ titulo }}">
    <meta property="og:url" content="{{ url_publica }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ titulo }}">
    <meta name="twitter:description" content="{{ descripcion }}">
    <meta name="twitter:image" content="{{ imagen_url }}">

    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f6f3;
            color: #1c201c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
        .brand {
            display: flex; align-items: center; gap: 10px;
            color: #225428; font-weight: 700; font-size: 15px;
            letter-spacing: .3px; text-transform: uppercase;
        }
        .brand span { width: 10px; height: 10px; border-radius: 50%; background: #d4af37; }
        .card {
            background: #fff; border: 1px solid #dee4de; border-radius: 16px;
            overflow: hidden; margin-top: 14px;
            box-shadow: 0 6px 18px rgba(34, 84, 40, .07);
        }
        .card img { display: block; width: 100%; height: auto; }
        .texto {
            padding: 18px 18px 6px; font-size: 16px; line-height: 1.55;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .acciones { display: grid; gap: 10px; padding: 16px 18px 20px; }
        .btn {
            display: block; text-align: center; text-decoration: none;
            padding: 12px 16px; border-radius: 10px; font-weight: 700;
            font-size: 15px; border: 2px solid transparent; cursor: pointer;
        }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-fb { background: #1877F2; color: #fff; }
        .btn-copiar { background: #fff; color: #225428; border-color: #225428; }
        .btn-sitio { background: transparent; color: #6e766e; font-weight: 600; }
        .pie { text-align: center; color: #6e766e; font-size: 12px; margin-top: 18px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand"><span></span>{{ nombre_liga }}</div>

    <div class="card">
        <img src="{{ imagen_url }}" alt="{{ titulo }}">
        <div class="texto" id="textoCompartir">{{ texto }}</div>
        <div class="acciones">
            <a class="btn btn-wa" href="{{ whatsapp_url }}" target="_blank" rel="noopener">Compartir por WhatsApp</a>
            <a class="btn btn-fb" href="{{ facebook_url }}" target="_blank" rel="noopener">Compartir en Facebook</a>
            <button class="btn btn-copiar" type="button" id="btnCopiar">Copiar texto</button>
            <a class="btn btn-sitio" href="{{ volver_url }}">Ver juventinorosasliga.com</a>
        </div>
    </div>

    <p class="pie">Comparte este enlace: la imagen y el texto aparecen en la vista previa.</p>
</div>
<script>
(function(){
    var btn = document.getElementById('btnCopiar');
    var txt = document.getElementById('textoCompartir');
    if(!btn || !txt) return;
    btn.addEventListener('click', function(){
        var texto = txt.textContent || '';
        if(navigator.clipboard){
            navigator.clipboard.writeText(texto).catch(function(){});
        } else {
            var ta = document.createElement('textarea');
            ta.value = texto;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }
        btn.textContent = '¡Texto copiado!';
        setTimeout(function(){ btn.textContent = 'Copiar texto'; }, 2000);
    });
})();
</script>
</body>
</html>
