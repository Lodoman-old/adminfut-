{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center">
    <h3>Cerrando sesión...</h3>
    <p class="text-muted">Serás redirigido en un momento.</p>
</div>
<script>
(function() {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins) {
        if (Capacitor.Plugins.Preferences) {
            Capacitor.Plugins.Preferences.remove({ key: 'is_logged_in' });
        }
        if (Capacitor.Plugins.NativeBiometric) {
            Capacitor.Plugins.NativeBiometric.deleteCredentials({ server: 'adminfut' });
        }
    }
    setTimeout(function() { window.location.href = '/'; }, 1500);
})();
</script>
{% endblock %}
