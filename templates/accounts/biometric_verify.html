{% extends "base.html" %}
{% block title %}Verificar identidad - AdminFut{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header text-center"><h4><i class="bi bi-shield-lock"></i> Confirmación</h4></div>
            <div class="card-body text-center py-5">
                <div id="bio-loading" class="py-5">
                    <div class="spinner-border text-success mb-3" role="status" style="width:3rem;height:3rem;"></div>
                    <p>Verificando dispositivo...</p>
                </div>
                <div id="bio-prompt" style="display:none">
                    <div style="font-size:64px;margin-bottom:16px;">&#128522;</div>
                    <h5>Confirma tu identidad</h5>
                    <p class="text-muted">Usa tu huella digital para verificar que eres tú</p>
                    <button id="btnFingerprint" class="btn btn-success btn-lg w-100">
                        <i class="bi bi-fingerprint"></i> Usar huella digital
                    </button>
                </div>
                <div id="bio-retry" style="display:none" class="alert alert-danger mt-3">
                    Error de verificación. <button id="btnRetry" class="btn btn-sm btn-outline-danger ms-2">Intentar de nuevo</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function() {
    var loading = document.getElementById('bio-loading');
    var prompt = document.getElementById('bio-prompt');
    var retry = document.getElementById('bio-retry');

    function goHome() {
        window.location.href = '{% url "home" %}';
    }

    function pollCapacitor(attempts) {
        if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.NativeBiometric) {
            loading.style.display = 'none';
            prompt.style.display = 'block';
            return;
        }
        if (attempts >= 25) {
            goHome(); // Sin Capacitor (navegador web)
            return;
        }
        setTimeout(function() { pollCapacitor(attempts + 1); }, 200);
    }

    function doVerify() {
        Capacitor.Plugins.NativeBiometric.verifyIdentity({
            reason: 'Acceder a AdminFut',
            title: 'Huella digital',
            subtitle: 'Usa tu huella para acceder',
            description: 'Coloca tu dedo en el sensor'
        }).then(function() {
            // verifyIdentity() retorna Promise<void> en v8.x
            // Si se resuelve, la huella fue exitosa
            fetch('{% url "biometric_verify" %}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            }).then(function(r) { return r.json(); }).then(function(data) {
                window.location.href = data.redirect || '{% url "home" %}';
            }).catch(function() {
                goHome();
            });
        }).catch(function() {
            // verifyIdentity rechazo — verificar disponibilidad del sensor
            Capacitor.Plugins.NativeBiometric.isAvailable().then(function(result) {
                if (result.isAvailable) {
                    prompt.style.display = 'none';
                    retry.style.display = 'block';
                } else {
                    goHome(); // Sin sensor biometrico
                }
            }).catch(function() {
                goHome(); // No se pudo determinar, omitir verificacion
            });
        });
    }

    document.getElementById('btnFingerprint').addEventListener('click', doVerify);
    document.getElementById('btnRetry').addEventListener('click', function() {
        retry.style.display = 'none';
        prompt.style.display = 'block';
    });

    pollCapacitor(0);
})();
</script>
{% endblock %}
