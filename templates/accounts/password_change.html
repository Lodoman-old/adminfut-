{% extends "base.html" %}
{% block title %}Cambiar Contraseña - AdminFut{% endblock %}
{% block content %}
<h3><i class="bi bi-key"></i> Cambiar Contraseña</h3>
<div class="card mt-3" style="max-width:500px;margin:0 auto">
    <div class="card-header bg-warning text-dark"><h5 class="mb-0">Cambiar tu contraseña</h5></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-warning"><i class="bi bi-check-lg"></i> Cambiar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
