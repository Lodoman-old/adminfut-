{% extends "base.html" %}
{% block title %}Iniciar sesión - AdminFut{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header text-center"><h4><i class="bi bi-trophy"></i> AdminFut</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm w-100">
                        <i class="bi bi-eye"></i> Ver como invitado
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Preferences) {
        Capacitor.Plugins.Preferences.get({ key: 'is_logged_in' }).then(function(r) {
            if (r.value === 'true') {
                var row = document.querySelector('.row.justify-content-center');
                if (!row) return;
                var col = row.querySelector('.col-md-4');
                if (!col) return;
                var card = col.querySelector('.card');
                if (!card) return;
                var body = card.querySelector('.card-body');
                if (!body) return;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-success w-100 mt-2';
                btn.innerHTML = '<i class="bi bi-fingerprint"></i> Acceso con huella';
                btn.onclick = function() {
                    Capacitor.Plugins.NativeBiometric.verifyIdentity({
                        reason: 'Acceder a AdminFut',
                        title: 'Huella digital',
                        subtitle: 'Usa tu huella para acceder',
                        description: 'Coloca tu dedo en el sensor'
                    }).then(function(res) {
                        if (res.verified) {
                            window.location.href = '/';
                        }
                    }).catch(function(err) {
                        console.error('Biometric error:', err);
                    });
                };
                body.appendChild(btn);
            }
        });
    }
})();
</script>
{% endblock %}
