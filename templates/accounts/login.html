{% extends "base.html" %}
{% block title %}Iniciar sesión - AdminFut{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header text-center"><h4><i class="bi bi-trophy"></i> AdminFut</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm w-100 mb-2">
                        <i class="bi bi-eye"></i> Ver como invitado
                    </a>
                    <a href="{% url 'registro_invitado' %}" class="btn btn-info btn-sm w-100">
                        <i class="bi bi-person-plus"></i> Registrarse y recibir notificaciones
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    if (typeof Capacitor === 'undefined' || !Capacitor.Plugins) return;

    var form = document.querySelector('form');
    if (!form) return;

    // Mark as logged in (so auto-biometric triggers on next app open)
    function markLoggedIn() {
        if (Capacitor.Plugins.Preferences) {
            Capacitor.Plugins.Preferences.set({ key: 'is_logged_in', value: 'true' });
        }
    }

    // Store credentials when user submits manually
    form.addEventListener('submit', function() {
        var u = form.querySelector('input[name="username"]');
        var p = form.querySelector('input[name="password"]');
        if (u && p && Capacitor.Plugins.NativeBiometric) {
            Capacitor.Plugins.NativeBiometric.setCredentials({
                username: u.value,
                password: p.value,
                server: 'adminfut'
            });
        }
        markLoggedIn();
    });

    // Auto biometric login if previously logged in
    if (Capacitor.Plugins.Preferences) {
        Capacitor.Plugins.Preferences.get({ key: 'is_logged_in' }).then(function(r) {
            if (r.value !== 'true') return;
            if (!Capacitor.Plugins.NativeBiometric) return;
            Capacitor.Plugins.NativeBiometric.verifyIdentity({
                reason: 'Acceder a AdminFut',
                title: 'Huella digital',
                subtitle: 'Usa tu huella para acceder',
                description: 'Coloca tu dedo en el sensor'
            }).then(function(res) {
                if (!res.verified) return;
                window.name = 'bio_verified=1';
                Capacitor.Plugins.NativeBiometric.getCredentials({ server: 'adminfut' }).then(function(creds) {
                    var u = form.querySelector('input[name="username"]');
                    var p = form.querySelector('input[name="password"]');
                    if (u && p && creds.username && creds.password) {
                        markLoggedIn();
                        u.value = creds.username;
                        p.value = creds.password;
                        form.submit();
                    }
                });
            }).catch(function() {
                // fallback: show normal form
            });
        });
    }
})();
</script>
{% endblock %}
