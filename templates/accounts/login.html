{% extends "base.html" %}
{% block title %}Iniciar sesión - AdminFut{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header text-center"><h4><i class="bi bi-trophy"></i> AdminFut</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <hr>
                <p class="text-center text-muted mb-0">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm w-100 mb-2">
                        <i class="bi bi-eye"></i> Ver como invitado
                    </a>
                    <a href="{% url 'registro_invitado' %}" class="btn btn-info btn-sm w-100">
                        <i class="bi bi-person-plus"></i> Registrarse y recibir notificaciones
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var huellaFallida = {{ via_huella_fallida|yesno:"true,false" }};
    function prefsOk() { return typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Preferences; }
    function bioOk() { return typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.NativeBiometric; }
    var form = document.querySelector('form');
    if (!form) return;

    if (huellaFallida) {
        if (bioOk()) Capacitor.Plugins.NativeBiometric.deleteCredentials({ server: 'adminfut' });
        if (prefsOk()) Capacitor.Plugins.Preferences.remove({ key: 'is_logged_in' });
        var aviso = document.createElement('div');
        aviso.className = 'alert alert-danger mt-3';
        aviso.innerHTML = '<i class="bi bi-exclamation-triangle"></i> La huella no pudo iniciar sesión. Ingresa tu usuario y contraseña para actualizar el acceso.';
        form.parentNode.insertBefore(aviso, form);
    }

    // Al enviar el login manual: guarda las credenciales protegidas por huella
    // para que en este mismo dispositivo se pueda entrar con huella después.
    form.addEventListener('submit', function() {
        if (prefsOk()) Capacitor.Plugins.Preferences.set({ key: 'is_logged_in', value: 'true' });
        if (!form.__viaHuella && bioOk()) {
            var u = form.querySelector('input[name="username"]');
            var p = form.querySelector('input[name="password"]');
            if (u && p && u.value && p.value) {
                Capacitor.Plugins.NativeBiometric.setCredentials({
                    username: u.value, password: p.value, server: 'adminfut'
                });
            }
        }
    });

    function viaHuellaLogin(creds) {
        var u = form.querySelector('input[name="username"]');
        var p = form.querySelector('input[name="password"]');
        if (!u || !p || !creds.username || !creds.password) return;
        var h = document.createElement('input');
        h.type = 'hidden'; h.name = 'via_huella'; h.value = '1';
        form.appendChild(h);
        form.__viaHuella = true;
        u.value = creds.username;
        p.value = creds.password;
        form.submit();
    }

    function pedirHuella() {
        if (!bioOk()) return Promise.resolve(false);
        return Capacitor.Plugins.NativeBiometric.verifyIdentity({
            reason: 'Acceder a AdminFut',
            title: 'Huella digital',
            subtitle: 'Usa tu huella para entrar',
            description: 'Coloca tu dedo en el sensor'
        }).then(function() { return true; })
          .catch(function() { return false; });
    }

    function accesoConHuella() {
        if (!bioOk()) return;
        Capacitor.Plugins.NativeBiometric.getCredentials({ server: 'adminfut' }).then(function(creds) {
            if (!creds || !creds.username) return;
            pedirHuella().then(function(ok) {
                if (ok) viaHuellaLogin(creds);
            });
        }).catch(function() {});
    }

    // Botón manual "Acceso con huella" (visible si hay credenciales guardadas)
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-outline-success w-100 mt-2';
    btn.innerHTML = '<i class="bi bi-fingerprint"></i> Acceso con huella';
    btn.style.display = 'none';
    btn.onclick = accesoConHuella;
    var cardBody = document.querySelector('.card-body');
    if (cardBody) cardBody.appendChild(btn);

    // Flujo invitado: si hay huella de invitado guardada, pide la huella al
    // abrir la app y entra directo al home reconociendo al invitado.
    function revisarInvitado() {
        if (!bioOk()) return;
        Capacitor.Plugins.NativeBiometric.getCredentials({ server: 'adminfut_invitado' }).then(function(creds) {
            if (!creds || !creds.username) return;
            Capacitor.Plugins.Preferences.get({ key: 'guest_phone' }).then(function(r) {
                if (!r.value || huellaFallida) return;
                pedirHuella().then(function(ok) {
                    if (!ok) return;
                    // Restaurar la categoría principal del invitado antes de entrar al home
                    Capacitor.Plugins.Preferences.get({ key: 'guest_categoria' }).then(function(pref) {
                        if (pref && pref.value) {
                            document.cookie = 'cat_preferida=' + pref.value + '; path=/; max-age=31536000; SameSite=Lax';
                        }
                        window.location.href = '/';
                    }).catch(function() { window.location.href = '/'; });
                });
            }).catch(function() {});
        }).catch(function() {});
    }

    // Auto-login con huella si en este dispositivo ya se había iniciado sesión.
    // Primero el de staff; si no hay, se revisa el de invitado.
    if (bioOk() && !huellaFallida) {
        Capacitor.Plugins.NativeBiometric.getCredentials({ server: 'adminfut' }).then(function(creds) {
            if (!creds || !creds.username) {
                revisarInvitado();
                return;
            }
            btn.style.display = 'block';
            Capacitor.Plugins.Preferences.get({ key: 'is_logged_in' }).then(function(r) {
                if (r.value !== 'true') return;
                pedirHuella().then(function(ok) {
                    if (ok) viaHuellaLogin(creds);
                });
            }).catch(function() {});
        }).catch(function() { revisarInvitado(); });
    } else if (!bioOk()) {
        revisarInvitado();
    }
})();
</script>
{% endblock %}
