{% for a in anuncios %}
{% if a.tamano == "MEDIO" %}
<div class="card banner-anuncio banner-medio mb-3 shadow-sm border-primary" data-anuncio-id="{{ a.id }}">
  <a href="{% url 'detalle_anuncio' a.id %}" class="text-decoration-none">
    <div class="card-body p-2" style="background: linear-gradient(135deg, #eef6ff, #fff);">
      {% if a.imagen %}
      <div class="text-center mb-2">
        <img src="{{ a.imagen.url }}" alt="{{ a.titulo }}" class="img-fluid rounded" style="max-height: 70px; object-fit: contain;">
      </div>
      {% endif %}
      <div class="text-center">
        <span class="badge bg-primary mb-1"><i class="bi bi-megaphone"></i> Publicidad</span>
        <h6 class="mb-1 fw-bold text-dark">{{ a.titulo }}</h6>
        {% if a.descripcion %}<p class="mb-1 text-dark small">{{ a.descripcion|truncatechars:90 }}</p>{% endif %}
        {% if a.enlace %}<span class="btn btn-primary btn-sm btn-anuncio"><i class="bi bi-box-arrow-up-right"></i> Ver más</span>{% endif %}
      </div>
    </div>
  </a>
</div>
{% endif %}
{% endfor %}
